name: OpenSky snapshot

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/refresh-opensky-snapshot.js
      - name: Commit if the set changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/opensky-live/snapshot.js
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "dane opensky"
            git push
          fi
